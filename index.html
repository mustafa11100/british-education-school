<div id="loginPage" class="login-page">

  <div class="login-card">

    <div class="school-logo">
      🎓
    </div>

    <h1>نظام إدارة المدرسة</h1>

    <p class="login-subtitle">
      British Education School Portal
    </p>

    <form id="loginForm">

      <div class="form-group">

        <label for="username">
          اسم المستخدم
        </label>

        <input
          id="username"
          name="username"
          type="text"
          placeholder="مثال: mustafa"
          autocomplete="username"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          كلمة المرور
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="اكتب كلمة المرور"
          autocomplete="current-password"
          required
        >

      </div>

      <button
        type="submit"
        class="btn btn-primary login-button"
      >
        تسجيل الدخول
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

    <div class="demo-accounts">

      <strong>الحساب الافتراضي للمدير</strong>

      <div>
        اسم المستخدم: admin
      </div>

      <div>
        كلمة المرور: 1234
      </div>

    </div>

  </div>

</div>
