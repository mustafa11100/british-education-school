<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المدرسة المتكامل</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --primary: #173b70;
      --primary2: #245ca8;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #718096;
      --border: #e3e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --shadow: 0 8px 25px rgba(20,40,80,.08);
      --radius: 16px;
    }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* AUTH SCREEN */
    #authScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at top right, rgba(36,92,168,.35), transparent 35%), linear-gradient(135deg, #102b53, #173b70 50%, #245ca8);
    }
    .auth-box { width: 100%; max-width: 480px; background: rgba(255,255,255,.97); border-radius: 24px; padding: 35px; box-shadow: 0 25px 70px rgba(0,0,0,.22); }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 34px; }
    .auth-title { text-align: center; margin: 0; font-size: 26px; }
    .auth-subtitle { text-align: center; color: var(--muted); margin: 8px 0 25px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: bold; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); background: white; padding: 11px 13px; border-radius: 10px; outline: none; font-size: 14px; }
    
    .btn { border: 0; border-radius: 10px; padding: 11px 17px; font-weight: bold; font-size: 14px; transition: .2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary2); }
    .btn-danger { background: var(--danger); color: white; }
    .full { width: 100%; }

    /* APP LAYOUT */
    #app { min-height: 100vh; display: flex; }
    .sidebar { width: 270px; min-height: 100vh; background: #102f5d; color: white; position: fixed; right: 0; top: 0; bottom: 0; overflow-y: auto; }
    .sidebar-header { padding: 22px 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .nav-item { width: calc(100% - 18px); margin: 3px 9px; border: 0; background: transparent; color: white; text-align: right; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.13); }
    .main { flex: 1; margin-right: 270px; min-width: 0; }
    .topbar { height: 72px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; sticky: top; }
    .content { padding: 25px; max-width: 1400px; margin: auto; }

    /* CARDS & TABLES */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .stat-value { font-size: 26px; font-weight: bold; margin-top: 10px; }
    .table-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 13px 14px; border-bottom: 1px solid #edf0f4; font-size: 13px; }
    th { background: #f7f9fc; }

    /* TOAST */
    #toastContainer { position: fixed; left: 20px; bottom: 20px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; background: #172033; color: white; padding: 12px 16px; border-radius: 10px; }
    .toast.error { border-right: 4px solid var(--danger); }
    .toast.success { border-right: 4px solid var(--success); }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<section id="authScreen">
  <div class="auth-box">
    <div class="logo">🏫</div>
    <h1 class="auth-title">إدارة المدرسة</h1>
    <p class="auth-subtitle">النظام الموحد المتكامل</p>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input id="loginUsername" type="text" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input id="loginPassword" type="password" required>
      </div>
      <button type="submit" class="btn btn-primary full">تسجيل الدخول</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden">
      <div class="form-group"><label>الاسم الكامل</label><input id="regName" type="text" required></div>
      <div class="form-group"><label>اسم المستخدم</label><input id="regUsername" type="text" required></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input id="regEmail" type="email" required></div>
      <div class="form-group"><label>رقم الهاتف</label><input id="regPhone" type="text"></div>
      <div class="form-group">
        <label>الوظيفة / الدور</label>
        <select id="regRole">
          <option value="student">طالب</option>
          <option value="parent">ولي أمر</option>
          <option value="teacher">معلم</option>
          <option value="accountant">محاسب</option>
        </select>
      </div>
      <div class="form-group"><label>كلمة المرور</label><input id="regPassword" type="password" required></div>
      <button type="submit" class="btn btn-primary full">تقديم طلب التسجيل</button>
    </form>

    <div style="text-align:center; margin-top:15px;">
      <button id="switchAuthBtn" style="border:0; background:transparent; color:var(--primary2); font-weight:bold;" onclick="toggleAuth()">تسجيل جديد</button>
    </div>
  </div>
</section>

<!-- MAIN APP -->
<section id="app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3 id="brandSchool">المدرسة</h3>
    </div>
    <button class="nav-item active" onclick="navigate('dashboard')">📊 لوحة التحكم</button>
    <button class="nav-item" onclick="navigate('students')">🎓 الطلاب والرسوم</button>
    <button class="nav-item" onclick="navigate('notifications')">🔔 الإشعارات</button>
    <button class="nav-item" onclick="navigate('settings')">⚙️ الإعدادات</button>
    <div style="padding:20px;">
      <button class="btn btn-danger full" onclick="logout()">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h3 id="pageTitle">لوحة التحكم</h3>
      <div>👤 <span id="topUserName">المستخدم</span></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</section>

<div id="toastContainer"></div>

<script>
  let currentUser = null;

  async function api(url, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (currentUser?.id) headers["x-user-id"] = String(currentUser.id);

    const res = await fetch(url, { ...options, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "حدث خطأ");
    return data;
  }

  function toast(msg, type = "success") {
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById("toastContainer").appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function toggleAuth() {
    const isReg = document.getElementById("registerForm").classList.toggle("hidden");
    document.getElementById("loginForm").classList.toggle("hidden");
    document.getElementById("switchAuthBtn").textContent = isReg ? "تسجيل جديد" : "تسجيل الدخول";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const res = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          username: document.getElementById("loginUsername").value,
          password: document.getElementById("loginPassword").value
        })
      });
      currentUser = res.user;
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("topUserName").textContent = currentUser.name;
      navigate("dashboard");
      toast("تم تسجيل الدخول بنجاح");
    } catch (err) { toast(err.message, "error"); }
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const res = await api("/api/register", {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("regName").value,
          username: document.getElementById("regUsername").value,
          email: document.getElementById("regEmail").value,
          phone: document.getElementById("regPhone").value,
          role: document.getElementById("regRole").value,
          password: document.getElementById("regPassword").value
        })
      });
      toast(res.message);
      toggleAuth();
    } catch (err) { toast(err.message, "error"); }
  });

  async function navigate(page) {
    const content = document.getElementById("content");
    document.getElementById("pageTitle").textContent = 
      page === 'dashboard' ? 'لوحة التحكم' :
      page === 'students' ? 'الطلاب والرسوم الدراسية' :
      page === 'notifications' ? 'التنبيهات والإشعارات' : 'إعدادات المنصة';

    if (page === 'dashboard') {
      const data = await api("/api/dashboard");
      content.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">إجمالي الطلاب<div class="stat-value">${data.stats.students}</div></div>
          <div class="stat-card">المستخدمين المسجلين<div class="stat-value">${data.stats.users}</div></div>
          <div class="stat-card">الحسابات المعلقة<div class="stat-value">${data.stats.pendingUsers}</div></div>
          <div class="stat-card">الرسوم المحصلة<div class="stat-value">$${data.stats.paidTuition}</div></div>
        </div>
      `;
    } else if (page === 'students') {
      const students = await api("/api/students");
      content.innerHTML = `
        <div class="table-card">
          <table>
            <thead>
              <tr><th>اسم الطالب</th><th>الصف</th><th>الهاتف</th><th>إجمالي الرسوم</th><th>الحالة</th></tr>
            </thead>
            <tbody>
              ${students.map(s => `
                <tr>
                  <td>${s.name}</td>
                  <td>${s.class_name || '-'}</td>
                  <td>${s.parent_phone || '-'}</td>
                  <td>$${s.total_tuition}</td>
                  <td>${s.remaining_amount <= 0 ? '✅ مدفوع بالكامل' : '⏳ متبقي $' + s.remaining_amount}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } else if (page === 'settings') {
      const settings = await api("/api/settings");
      content.innerHTML = `
        <div class="table-card" style="padding:20px;">
          <form onsubmit="saveSettings(event)">
            <div class="form-group"><label>اسم المنصة</label><input id="setPlatform" value="${settings.platform_name || ''}"></div>
            <div class="form-group"><label>اسم المدرسة</label><input id="setSchool" value="${settings.school_name || ''}"></div>
            <div class="form-group"><label>البريد الرسمي</label><input id="setEmail" value="${settings.email || ''}"></div>
            <button class="btn btn-primary" type="submit">حفظ التغييرات</button>
          </form>
        </div>
      `;
    }
  }

  async function saveSettings(e) {
    e.preventDefault();
    try {
      await api("/api/settings", {
        method: "POST",
        body: JSON.stringify({
          platform_name: document.getElementById("setPlatform").value,
          school_name: document.getElementById("setSchool").value,
          email: document.getElementById("setEmail").value
        })
      });
      toast("تم حفظ الإعدادات");
    } catch (err) { toast(err.message, "error"); }
  }

  function logout() {
    currentUser = null;
    document.getElementById("app").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");
  }
</script>
</body>
</html>
