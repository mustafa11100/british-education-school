<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إدارة المدرسة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #173b70;
      --primary2: #245ca8;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #718096;
      --border: #e3e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --shadow: 0 8px 25px rgba(20,40,80,.08);
      --radius: 16px;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ================= LOGIN ================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, rgba(36,92,168,.35), transparent 35%),
        linear-gradient(135deg, #102b53, #173b70 50%, #245ca8);
    }

    .auth-box {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.22);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 34px;
    }

    .auth-title {
      text-align: center;
      margin: 0;
      font-size: 26px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin: 8px 0 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      padding: 12px 13px;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      color: var(--text);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary2);
      box-shadow: 0 0 0 3px rgba(36,92,168,.1);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      font-weight: bold;
      font-size: 14px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary2);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-light {
      background: #eef2f7;
      color: var(--text);
    }

    .full {
      width: 100%;
    }

    .auth-switch {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
    }

    .auth-switch button {
      border: 0;
      background: transparent;
      color: var(--primary2);
      font-weight: bold;
    }

    /* ================= APP ================= */

    #app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 270px;
      min-height: 100vh;
      background: #102f5d;
      color: white;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 50;
    }

    .sidebar-header {
      padding: 22px 18px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: rgba(255,255,255,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: bold;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: .7;
      margin-top: 3px;
    }

    .nav-section {
      padding: 18px 14px 5px;
      font-size: 11px;
      opacity: .55;
    }

    .nav-item {
      width: calc(100% - 18px);
      margin: 3px 9px;
      border: 0;
      background: transparent;
      color: white;
      text-align: right;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: rgba(255,255,255,.13);
    }

    .nav-icon {
      width: 25px;
      text-align: center;
      font-size: 17px;
    }

    .sidebar-footer {
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,.12);
      margin-top: 15px;
    }

    .user-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main {
      flex: 1;
      margin-right: 270px;
      min-width: 0;
    }

    .topbar {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: #eef2f7;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 20px;
    }

    .content {
      padding: 25px;
      max-width: 1500px;
      margin: auto;
    }

    /* ================= DASHBOARD ================= */

    .welcome {
      background: linear-gradient(120deg, #173b70, #245ca8);
      color: white;
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .welcome h2 {
      margin: 0 0 7px;
    }

    .welcome p {
      margin: 0;
      opacity: .85;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-icon {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      background: #edf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-value {
      font-size: 29px;
      font-weight: bold;
      margin-top: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 17px;
    }

    .attendance-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .attendance-box {
      padding: 18px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: center;
    }

    .attendance-box strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    /* ================= PAGE ================= */

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .page-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .page-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .table-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-tools {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .table-tools input {
      max-width: 320px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid #edf0f4;
      text-align: right;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      background: #f7f9fc;
      font-weight: bold;
    }

    tr:hover td {
      background: #fafcff;
    }

    .badge {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-success {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-warning {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-info {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .online-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-left: 5px;
    }

    .offline-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      margin-left: 5px;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close-btn {
      border: 0;
      background: #f1f5f9;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 18px;
    }

    .modal-body {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .form-grid .full-field {
      grid-column: 1 / -1;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-start;
      gap: 8px;
    }

    /* ================= TOAST ================= */

    #toastContainer {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 280px;
      max-width: 400px;
      background: #172033;
      color: white;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      animation: toastIn .25s ease;
    }

    .toast.success {
      border-right: 4px solid var(--success);
    }

    .toast.error {
      border-right: 4px solid var(--danger);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================= EMPTY ================= */

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        transform: translateX(100%);
        transition: .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-right: 0;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 15px;
      }

      .content {
        padding: 15px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .attendance-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .auth-box {
        padding: 25px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full-field {
        grid-column: auto;
      }

      .topbar-title {
        font-size: 16px;
      }

      .topbar-right .school-name {
        display: none;
      }

      .welcome {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<!-- ======================================================
     شاشة الدخول
====================================================== -->

<section id="authScreen">

  <div class="auth-box">

    <div class="logo">🏫</div>

    <h1 class="auth-title">إدارة المدرسة</h1>

    <p class="auth-subtitle">
      نظام الإدارة المدرسية المتكامل
    </p>

    <!-- LOGIN -->

    <form id="loginForm">

      <div class="form-group">
        <label>اسم المستخدم</label>
        <input
          id="loginUsername"
          type="text"
          placeholder="أدخل اسم المستخدم"
          required
        >
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="أدخل كلمة المرور"
          required
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary full"
      >
        تسجيل الدخول
      </button>

    </form>

    <!-- REGISTER -->

    <form
      id="registerForm"
      class="hidden"
    >

      <div class="form-group">
        <label>اسمك</label>
        <input
          id="registerName"
          type="text"
          placeholder="الاسم الكامل"
          required
        >
      </div>

      <div class="form-group">
        <label>اسم المستخدم</label>
        <input
          id="registerUsername"
          type="text"
          placeholder="اسم المستخدم"
          required
        >
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input
          id="registerPassword"
          type="password"
          placeholder="كلمة المرور"
          required
        >
      </div>

      <div class="form-group">
        <label>رقم الهاتف</label>
        <input
          id="registerPhone"
          type="text"
          placeholder="رقم الهاتف"
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary full"
      >
        إنشاء الحساب
      </button>

    </form>

    <div class="auth-switch">

      <span id="switchText">
        ليس لديك حساب؟
      </span>

      <button
        id="switchAuthBtn"
        type="button"
        onclick="toggleAuth()"
      >
        تسجيل جديد
      </button>

    </div>

  </div>

</section>


<!-- ======================================================
     التطبيق
====================================================== -->

<section
  id="app"
  class="hidden"
>

  <!-- SIDEBAR -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebar-header">

      <div class="brand">

        <div class="brand-icon">
          🏫
        </div>

        <div>

          <div
            class="brand-title"
            id="brandSchool"
          >
            إدارة المدرسة
          </div>

          <div class="brand-subtitle">
            School Management
          </div>

        </div>

      </div>

    </div>


    <div class="nav-section">
      الرئيسية
    </div>

    <button
      class="nav-item active"
      data-page="dashboard"
      onclick="navigate('dashboard')"
    >
      <span class="nav-icon">📊</span>
      لوحة التحكم
    </button>


    <div class="nav-section">
      الإدارة
    </div>

    <button
      class="nav-item"
      data-page="users"
      onclick="navigate('users')"
    >
      <span class="nav-icon">👥</span>
      المستخدمون
    </button>

    <button
      class="nav-item"
      data-page="schools"
      onclick="navigate('schools')"
    >
      <span class="nav-icon">🏫</span>
      المدارس
    </button>

    <button
      class="nav-item"
      data-page="students"
      onclick="navigate('students')"
    >
      <span class="nav-icon">🎓</span>
      الطلاب
    </button>

    <button
      class="nav-item"
      data-page="attendance"
      onclick="navigate('attendance')"
    >
      <span class="nav-icon">📝</span>
      الحضور
    </button>

    <button
      class="nav-item"
      data-page="employees"
      onclick="navigate('employees')"
    >
      <span class="nav-icon">👨‍💼</span>
      الموظفون
    </button>

    <button
      class="nav-item"
      data-page="payroll"
      onclick="navigate('payroll')"
    >
      <span class="nav-icon">💰</span>
      الرواتب
    </button>


    <div class="nav-section">
      التواصل والتعليم
    </div>

    <button
      class="nav-item"
      data-page="notes"
      onclick="navigate('notes')"
    >
      <span class="nav-icon">🗒️</span>
      الملاحظات
    </button>

    <button
      class="nav-item"
      data-page="videos"
      onclick="navigate('videos')"
    >
      <span class="nav-icon">🎥</span>
      الحصص والفيديوهات
    </button>

    <button
      class="nav-item"
      data-page="announcements"
      onclick="navigate('announcements')"
    >
      <span class="nav-icon">📢</span>
      التعاميم
    </button>

    <button
      class="nav-item"
      data-page="requests"
      onclick="navigate('requests')"
    >
      <span class="nav-icon">📋</span>
      الطلبات
    </button>

    <button
      class="nav-item"
      data-page="messages"
      onclick="navigate('messages')"
    >
      <span class="nav-icon">💬</span>
      الرسائل
    </button>


    <div class="nav-section">
      التقارير
    </div>

    <button
      class="nav-item"
      data-page="reports"
      onclick="navigate('reports')"
    >
      <span class="nav-icon">📈</span>
      التقارير
    </button>

    <button
      class="nav-item"
      data-page="audit"
      onclick="navigate('audit')"
    >
      <span class="nav-icon">🔐</span>
      سجل العمليات
    </button>


    <div class="sidebar-footer">

      <div class="user-mini">

        <div class="avatar">
          👤
        </div>

        <div>

          <div id="sideUserName">
            المستخدم
          </div>

          <small
            id="sideUserRole"
            style="opacity:.65"
          >
            المستخدم
          </small>

        </div>

      </div>

      <button
        class="btn btn-danger full"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="topbar-right">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <div
          class="topbar-title"
          id="pageTitle"
        >
          لوحة التحكم
        </div>

      </div>

      <div class="topbar-right">

        <span
          class="school-name"
          id="topSchoolName"
        >
          —
        </span>

        <span>
          👤
        </span>

        <strong id="topUserName">
          —
        </strong>

      </div>

    </header>


    <div
      id="content"
      class="content"
    ></div>

  </main>

</section>


<!-- ======================================================
     MODAL
====================================================== -->

<div
  id="modal"
  class="modal hidden"
  onclick="if(event.target===this)closeModal()"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        نافذة
      </h3>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

/* =========================================================
   API
========================================================= */

async function api(url, options = {}) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (currentUser?.id) {
    headers["x-user-id"] = String(currentUser.id);
  }

  const response = await fetch(url, {
    ...options,
    headers
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      "حدث خطأ في الاتصال بالسيرفر"
    );
  }

  return data;
}


/* =========================================================
   TOAST
========================================================= */

function toast(message, type = "success") {

  const container =
    document.getElementById("toastContainer");

  const item =
    document.createElement("div");

  item.className =
    `toast ${type}`;

  item.textContent =
    message;

  container.appendChild(item);

  setTimeout(() => {
    item.remove();
  }, 3500);
}


/* =========================================================
   AUTH
========================================================= */

function toggleAuth() {

  const login =
    document.getElementById("loginForm");

  const register =
    document.getElementById("registerForm");

  const text =
    document.getElementById("switchText");

  const button =
    document.getElementById("switchAuthBtn");

  const registering =
    !register.classList.contains("hidden");

  if (registering) {

    register.classList.add("hidden");
    login.classList.remove("hidden");

    text.textContent =
      "ليس لديك حساب؟";

    button.textContent =
      "تسجيل جديد";

  } else {

    login.classList.add("hidden");
    register.classList.remove("hidden");

    text.textContent =
      "لديك حساب بالفعل؟";

    button.textContent =
      "تسجيل الدخول";

}

/* =========================================================
   PERMISSIONS
========================================================= */

const pagePermission = {

  users: "users",
  schools: "all",
  students: "students",
  attendance: "attendance",
  employees: "employees",
  payroll: "payroll",
  notes: "notes",
  videos: "videos",
  announcements: "announcements",
  requests: "requests",
  messages: "messages",
  reports: "reports",
  audit: "all"

};


function can(permission) {

  if (!currentUser) {
    return false;
  }

  if (currentUser.role === "owner") {
    return true;
  }

  const permissions =
    window.currentPermissions || [];

  return permissions.includes(permission);
}


async function applyPermissions() {

  try {

    const result =
      await api(
        `/api/me?user_id=${currentUser.id}`
      );

    window.currentPermissions =
      result.permissions || [];

  } catch {

    window.currentPermissions = [];
  }

  document
    .querySelectorAll(".nav-item")
    .forEach(button => {

      const page =
        button.dataset.page;

      if (page === "dashboard") {
        return;
      }

      if (page === "schools") {

        button.style.display =
          currentUser.role === "owner"
            ? "flex"
            : "none";

        return;
      }

      const permission =
        pagePermission[page];

      if (
        permission &&
        !can(permission)
      ) {
        button.style.display =
          "none";
      }
    });
}

  return Object.entries(roles)
    .filter(([key]) =>
      currentUser.role === "owner"
      || key !== "owner"

      <option
        value="${key}"

    .join("");

      document.getElementById("fUsername").value.trim(),

      await api("/api/users", {

      "error"

function editUser(id) {

  const user =
    usersCache.find(
      u => Number(u.id) === Number(id)

  if (user) {
    openUserModal(user);

}


async function saveUserEdit(id) {

  const data = {

    name:
      document.getElementById("fUserName").value.trim(),

    email:
      document.getElementById("fEmail").value.trim(),

    phone:
      document.getElementById("fPhone").value.trim(),

    job_title:
      document.getElementById("fJob").value.trim(),

    role:
      document.getElementById("fRole").value

  };

  const password =
    document
      .getElementById("fPassword")
      .value;

  if (password) {
    data.password =
      password;
  }

  try {

    const result =
      await api(
        `/api/users/${id}`,
        {
          method: "PATCH",
          body: JSON.stringify(data)
        }
      );

    closeModal();

    toast(
      result.message ||
      "تم تعديل المستخدم"
    );

    renderUsers();

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}


async function toggleUser(id, active) {

  if (
    !confirm(
      active
        ? "هل تريد تفعيل المستخدم؟"
        : "هل تريد إيقاف المستخدم؟"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/users/${id}/status`,
      {
        method: "PATCH",
        body: JSON.stringify({
          active
        })
      }
    );

    toast(
      active
        ? "تم تفعيل المستخدم"
        : "تم إيقاف المستخدم"
    );

    renderUsers();

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}

async function createSchool() {

async function saveSchoolEdit(id) {

  const data = {

    name:
      document.getElementById("fSchoolName").value.trim(),

    code:
      document.getElementById("fSchoolCode").value.trim(),

    email:
      document.getElementById("fSchoolEmail").value.trim(),

    phone:
      document.getElementById("fSchoolPhone").value.trim(),

    address:
      document.getElementById("fSchoolAddress").value.trim(),

    subscription_start:
      document.getElementById("fSubStart").value,

    subscription_end:
      document.getElementById("fSubEnd").value,

    subscription_status:
      document.getElementById("fSubStatus").value

  };

  try {

    await api(
      `/api/schools/${id}`,
      {
        method: "PATCH",
        body: JSON.stringify(data)
      }
    );

    closeModal();

    toast(
      "تم تعديل المدرسة"
    );

    renderSchools();

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}


async function toggleSchool(id, status) {

  if (
    !confirm(
      status === "active"
        ? "تفعيل المدرسة؟"
        : "إيقاف المدرسة؟"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/schools/${id}/status`,
      {
        method: "PATCH",
        body: JSON.stringify({
          status
        })
      }
    );

    toast(
      status === "active"
        ? "تم تفعيل المدرسة"
        : "تم إيقاف المدرسة"
    );

    renderSchools();

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}

      "تم إرسال الرسالة"
    );

    renderMessages();

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}

    }

    box.innerHTML = `

      <div class="table-wrap">

        <table>

          <thead>

              <th>المستخدم</th>
              <th>العملية</th>
              <th>التفاصيل</th>
              <th>التاريخ</th>
            </tr>

          </thead>

          <tbody>

            ${data.map(log => `

              <tr>

                <td>
                  ${escapeHtml(
                    log.user_name ||
                    log.username ||
                    "—"
                  )}
                </td>

                <td>
                  <span class="badge badge-info">
                    ${escapeHtml(log.action)}
                  </span>
                </td>

                <td>
                  ${escapeHtml(log.details || "—")}
                </td>

                <td>
                  ${escapeHtml(log.created_at || "—")}
                </td>

            `).join("")}

          </tbody>

        </table>

      </div>
    `;

  } catch (error) {

    toast(
      error.message,
      "error"
    );
  }
}


/* =========================================================
   MODAL
========================================================= */

function openModal(
  title,
  body,
  footer = ""
) {

  document
    .getElementById("modalTitle")
    .textContent =
      title;

  document
    .getElementById("modalBody")
    .innerHTML =
      body;

  document
    .getElementById("modalFooter")
    .innerHTML =
      footer;

  document
    .getElementById("modal")
    .classList.remove("hidden");
}


function closeModal() {

  document
    .getElementById("modal")
    .classList.add("hidden");
}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  if (
    !confirm(
      "هل تريد تسجيل الخروج؟"
    )
  ) {
    return;
  }

  currentUser = null;
  currentSchool = null;

  localStorage.removeItem(
    "school_user"
  );

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  document
    .getElementById("loginForm")
    .reset();

  toast(
    "تم تسجيل الخروج"
  );
}

async function sendActivity() {

  if (!currentUser?.id) {
    return;
  }

  try {

    await api(
      "/api/activity",
      {
        method: "POST",
        body: JSON.stringify({
          user_id:
            currentUser.id
        })
      }
    );

  } catch {
    // لا نوقف النظام إذا فشل النشاط
  }
}


setInterval(
  sendActivity,
  30000
);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttr(value) {

  return escapeHtml(value);
}


function roleName(role) {

  const names = {

    owner: "مالك النظام",
    admin: "مدير المدرسة",
    hr: "الموارد البشرية",
    accountant: "محاسب",
    teacher: "معلم",
    worker: "موظف",
    reviewer: "مراجع",
    parent: "ولي أمر",
    student: "طالب"

  };

  return names[role] || role || "—";
}


function money(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "ar-EG",
    {
      maximumFractionDigits: 2
    }
  );
}


function currentMonth() {

  return new Date()
    .toISOString()
    .slice(0, 7);
}


function today() {

  return new Date()
    .toISOString()
    .slice(0, 10);
}


function requestStatus(status) {

  if (status === "approved") {
    return `
      <span class="badge badge-success">
        موافق عليه
      </span>
    `;
  }

  if (status === "rejected") {
    return `
      <span class="badge badge-danger">
        مرفوض
      </span>
    `;
  }

  return `
    <span class="badge badge-warning">
      قيد الانتظار
    </span>
  `;
}

  return `

      <div class="empty">

        </p>

      </div>

    </div>
  `;
}
