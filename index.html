<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة إدارة المدارس</title><style>:root{--p:#173b70;--p2:#24579b;--a:#55b7ff;--bg:#f5f7fb;--card:#fff;--text:#152238;--muted:#718096;--line:#e6ebf2;--good:#159447;--bad:#d9363e;--shadow:0 18px 55px #173b7014}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:var(--p);color:#fff;cursor:pointer}button.light{background:#edf3fa;color:var(--p)}button.danger{background:#fff0f1;color:var(--bad)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0e2850,#173b70 55%,#24579b)}.loginbox{width:min(1050px,100%);display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 35px 100px #06172c66}.hero{padding:55px;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff}.hero .logo{width:78px;height:78px;border-radius:22px;background:#fff2;display:grid;place-items:center;font-size:38px;margin-bottom:22px}.hero h1{font-size:38px;margin:0 0 12px}.hero p{line-height:2;color:#dbeafe}.loginform{padding:45px}.loginform h2{font-size:28px;margin-top:0}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;outline:0}.full{width:100%}.top{height:72px;background:linear-gradient(100deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;box-shadow:0 8px 25px #173b7022}.brand{display:flex;align-items:center;gap:12px}.brandlogo{width:44px;height:44px;border-radius:13px;background:#fff2;display:grid;place-items:center;overflow:hidden}.brandlogo img{width:100%;height:100%;object-fit:cover}.brandname{font-weight:800}.brandsub{font-size:12px;color:#d9e8fb}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--p);font-weight:800}.layout{display:flex;min-height:calc(100vh - 72px)}aside{width:270px;background:#fff;border-left:1px solid var(--line);padding:18px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.label{font-size:11px;font-weight:800;color:#9aa6b6;margin:18px 10px 7px}.navbtn{width:100%;display:flex;align-items:center;gap:12px;text-align:right;background:transparent;color:#4a5870;margin:3px 0}.navbtn:hover,.navbtn.active{background:#eaf2fb;color:var(--p);font-weight:800}.icon{width:30px;text-align:center;font-size:18px}.main{flex:1;min-width:0;padding:26px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.head h2{margin:0;font-size:27px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);margin-top:7px}.stat b{font-size:30px;display:block;margin-top:4px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:17px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #eef1f5;text-align:right;white-space:nowrap}th{font-size:12px;color:#7b8798;background:#fafbfc}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3f8;color:#526174;font-size:12px}.good{background:#e7f7ed;color:var(--good)}.bad{background:#ffe8e9;color:var(--bad)}.notice{padding:13px;border-radius:13px;background:#fff7e6;color:#77500a;margin:10px 0}.empty{text-align:center;padding:35px;color:var(--muted)}.school{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px}.schoollogo{width:55px;height:55px;border-radius:14px;background:#edf3fa;display:grid;place-items:center;overflow:hidden}.schoollogo img{width:100%;height:100%;object-fit:cover}.modal{position:fixed;inset:0;background:#06172c77;display:grid;place-items:center;padding:20px;z-index:50}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f2f4f7;color:#445}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.loginbox{grid-template-columns:1fr}.hero{display:none}.layout{display:block}aside{position:fixed;right:0;top:72px;z-index:15;transform:translateX(100%);transition:.25s;width:275px}.layout.open aside{transform:translateX(0)}.main{padding:15px}.cards,.grid,.grid3{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="login"><div class="loginbox"><section class="hero"><div class="logo">🏫</div><h1>منصة إدارة المدارس</h1><p>نظام مؤسسي لإدارة المدارس والطلاب والمعلمين وأولياء الأمور والرسوم والنتائج والحضور، مع تحكم مركزي في المدارس والاشتراكات والهوية.</p></section><section class="loginform"><h2>تسجيل الدخول</h2><p class="muted">ادخل إلى حسابك للوصول إلى لوحة التحكم.</p><div id="loginMsg"></div><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="full" onclick="login()">دخول إلى المنصة</button></section></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><div id="brandLogo" class="brandlogo">🏫</div><div><div id="brandName" class="brandname">منصة إدارة المدارس</div><div id="brandSub" class="brandsub">لوحة الإدارة</div></div></div><div class="userbox"><span id="userName"></span><span id="avatar" class="avatar">م</span><button class="light" onclick="logout()">خروج</button></div></header><div class="layout"><aside id="nav"></aside><main class="main"><div id="view"></div></main></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const S={token:localStorage.getItem('school_token'),user:null,school:null};
const daily=[['home','⌂','الرئيسية'],['students','👨‍🎓','الطلاب'],['parents','👨‍👩‍👧','أولياء الأمور'],['teachers','👨‍🏫','المعلمون'],['classes','🏫','الفصول والمواد'],['schedule','🗓️','الجداول'],['attendance','📅','الحضور والغياب'],['results','📊','النتائج والاختبارات'],['notes','📝','ملاحظات الطلاب'],['fees','💰','الرسوم والمدفوعات'],['notifications','🔔','الإشعارات'],['reports','📈','التقارير']];
const admin=[['users','👥','المستخدمون'],['roles','🔐','الوظائف والصلاحيات'],['settings','⚙️','هوية المدرسة والإعدادات']];const prog=[['schools','🏢','المدارس والاشتراكات'],['platform','🧭','إدارة المنصة']];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(S.school?.id?{'X-School-Id':S.school.id}:{})};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}
function programmer(){return ['مبرمج','مبرمج النظام'].includes(S.user?.role)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function money(n){return Number(n||0).toLocaleString('ar-EG')}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});S.token=d.token;localStorage.setItem('school_token',S.token);await boot()}catch(e){loginMsg.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function boot(){try{S.user=(await api('/api/auth/me')).user}catch(e){localStorage.removeItem('school_token');return location.reload()}try{S.school=(await api('/api/saas/branding')).school;brandName.textContent=S.school.name;brandSub.textContent=S.user.role;document.documentElement.style.setProperty('--p',S.school.primary_color||'#173b70');document.documentElement.style.setProperty('--p2',S.school.secondary_color||'#24579b');if(S.school.logo_url)brandLogo.innerHTML='<img src="'+esc(S.school.logo_url)+'">'}catch{}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');userName.textContent=(S.user.full_name||S.user.username)+' • '+S.user.role;avatar.textContent=(S.user.full_name||'م')[0];buildNav();show('home')}
function btn(x){return `<button class="navbtn" id="nav-${x[0]}" onclick="show('${x[0]}')"><span class="icon">${x[1]}</span>${x[2]}</button>`}function buildNav(){let h='<div class="label">المدرسة</div>'+daily.map(btn).join('');if(programmer())h+='<div class="label">تحكم المبرمج</div>'+admin.map(btn).join('')+prog.map(btn).join('');else if(['مدير المدرسة','المدير الإداري'].includes(S.user.role))h+='<div class="label">الإدارة</div>'+admin.map(btn).join('');nav.innerHTML=h}
function active(id){document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+id)?.classList.add('active')}
async function show(id){active(id);view.innerHTML='<div class="panel empty">جاري التحميل...</div>';try{const f={home,students,parents,teachers,classes,schedule,attendance,results,notes,fees,notifications,reports,users,roles,settings,schools,platform};if(f[id])await f[id]()}catch(e){view.innerHTML='<div class="panel notice">'+esc(e.message)+'</div>'}}
async function home(){if(S.user.role==='ولي أمر')return parentHome();const [st,us,fe]=await Promise.all([api('/api/students'),api('/api/users').catch(()=>({users:[]})),api('/api/admin/fees').catch(()=>({fees:[]}))]);const total=(fe.fees||[]).reduce((a,x)=>a+Number(x.amount||0),0),paid=(fe.fees||[]).reduce((a,x)=>a+Number(x.paid||0),0);view.innerHTML=`<div class="head"><div><h2>لوحة التحكم</h2><p class="muted">نظرة مؤسسية على المدرسة.</p></div>${programmer()?'<button onclick="show(\'schools\')">🏢 إدارة المدارس</button>':''}</div><div class="cards"><div class="stat">👨‍🎓<small>الطلاب</small><b>${st.students?.length||0}</b></div><div class="stat">👥<small>المستخدمون</small><b>${us.users?.length||0}</b></div><div class="stat">💰<small>الرسوم</small><b>${money(total)}</b></div><div class="stat">⏳<small>المتبقي</small><b>${money(total-paid)}</b></div></div><div class="grid"><div class="panel"><h3>هوية المدرسة</h3><div class="school"><div class="schoollogo">${S.school?.logo_url?'<img src="'+esc(S.school.logo_url)+'">':'🏫'}</div><div><b>${esc(S.school?.name||'المدرسة')}</b><div class="muted">الخطة: ${esc(S.school?.plan||'—')} • الاشتراك: ${esc(S.school?.subscription_status||'—')}</div></div></div></div><div class="panel"><h3>إجراءات سريعة</h3><div class="toolbar"><button onclick="show('students')">الطلاب</button><button class="light" onclick="show('fees')">الرسوم</button><button class="light" onclick="show('results')">النتائج</button><button class="light" onclick="show('attendance')">الحضور</button></div></div></div>`}
async function parentHome(){const d=await api('/api/parent/dashboard');view.innerHTML=`<div class="head"><div><h2>بوابة ولي الأمر</h2><p class="muted">الأبناء والنتائج والحضور والرسوم وملاحظات الإدارة والمعلمين.</p></div></div><div class="cards"><div class="stat">👨‍👩‍👧<small>الأبناء</small><b>${d.students.length}</b></div><div class="stat">💰<small>الرسوم</small><b>${money(d.fees.reduce((a,x)=>a+Number(x.amount||0),0))}</b></div><div class="stat">💳<small>المدفوع</small><b>${money(d.payments.reduce((a,x)=>a+Number(x.amount||0),0))}</b></div><div class="stat">📝<small>الملاحظات</small><b>${d.notes.length}</b></div></div><div class="panel"><h3>أبنائي</h3>${tbl(['الطالب','الصف','الفصل'],d.students.map(s=>[esc(s.full_name),esc(s.grade||'—'),esc(s.class_name||'—')]))}</div><div class="grid"><div class="panel"><h3>النتائج</h3>${tbl(['المادة','الاختبار','الدرجة'],d.results.map(r=>[esc(r.subject),esc(r.exam||'—'),r.score+'/'+r.max_score]))}</div><div class="panel"><h3>ملاحظات الإدارة والمعلمين</h3>${d.notes.length?d.notes.map(n=>`<div class="school"><div>📝</div><div><b>${esc(n.title||'ملاحظة')}</b><p>${esc(n.content)}</p></div></div>`).join(''):'<div class="empty">لا توجد ملاحظات</div>'}</div></div>`}
function tbl(h,rows){return `<div class="wrap"><table><thead><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div>`}
async function students(){const d=await api('/api/students');view.innerHTML=`<div class="head"><div><h2>الطلاب</h2><p class="muted">ملفات الطلاب والصفوف والفصول.</p></div><button onclick="studentModal()">+ إضافة طالب</button></div><div class="panel">${tbl(['الاسم','الرقم','الصف','الفصل','الحالة'],d.students.map(s=>[esc(s.full_name),esc(s.student_number||'—'),esc(s.grade||'—'),esc(s.class_name||'—'),s.active?'<span class="pill good">نشط</span>':'<span class="pill bad">موقوف</span>']))}</div>`}
function studentModal(){openModal('إضافة طالب',`<div class="grid"><div class="field"><label>اسم الطالب</label><input id="sn"></div><div class="field"><label>الرقم</label><input id="sno"></div><div class="field"><label>الصف</label><input id="sg"></div><div class="field"><label>الفصل</label><input id="sc"></div></div><button onclick="saveStudent()">حفظ</button>`)}async function saveStudent(){await api('/api/students',{method:'POST',body:JSON.stringify({full_name:sn.value,student_number:sno.value,grade:sg.value,class_name:sc.value})});closeModal();students()}
async function parents(){const d=await api('/api/students');view.innerHTML=`<div class="head"><div><h2>أولياء الأمور</h2><p class="muted">ربط الأسر بالطلاب وبوابة المتابعة.</p></div></div><div class="panel"><div class="notice">ولي الأمر يرى أبناءه فقط، ورسومهم ونتائجهم وحضورهم وملاحظات الإدارة والمعلمين المسموح بعرضها.</div>${tbl(['الطالب','الصف','الفصل'],d.students.map(s=>[esc(s.full_name),esc(s.grade||'—'),esc(s.class_name||'—')]))}</div>`}
async function teachers(){const d=await api('/api/users').catch(()=>({users:[]}));view.innerHTML=`<div class="head"><div><h2>المعلمون</h2><p class="muted">الهيئة التعليمية وحساباتها.</p></div></div><div class="panel">${tbl(['الاسم','المستخدم','الوظيفة'],(d.users||[]).filter(u=>String(u.role).includes('معلم')).map(u=>[esc(u.full_name),esc(u.username),esc(u.role)]))}</div>`}
async function classes(){view.innerHTML='<div class="head"><div><h2>الفصول والمواد</h2><p class="muted">هيكل المدرسة الأكاديمي.</p></div></div><div class="grid3"><div class="panel"><h3>🏫 الفصول</h3><p class="muted">إدارة الفصول والغرف.</p></div><div class="panel"><h3>📚 المواد</h3><p class="muted">المواد الدراسية.</p></div><div class="panel"><h3>👨‍🏫 التكليفات</h3><p class="muted">ربط المعلمين بالمواد والفصول.</p></div></div>'}
async function schedule(){view.innerHTML='<div class="head"><div><h2>الجداول الدراسية</h2><p class="muted">الحصص والمعلمين والقاعات.</p></div></div><div class="panel empty">منطقة الجداول جاهزة لبيانات الحصص.</div>'}async function attendance(){view.innerHTML='<div class="head"><div><h2>الحضور والغياب</h2><p class="muted">تسجيل ومتابعة الحضور يومياً.</p></div></div><div class="panel empty">اختر الفصل والتاريخ لبدء التسجيل.</div>'}async function results(){view.innerHTML='<div class="head"><div><h2>النتائج والاختبارات</h2><p class="muted">درجات الطلاب والاختبارات والتقارير.</p></div></div><div class="panel empty">إدخال الدرجات وإظهارها لولي الأمر حسب الصلاحيات.</div>'}async function notes(){view.innerHTML='<div class="head"><div><h2>ملاحظات الطلاب</h2><p class="muted">ملاحظات الإدارة والمعلمين مع التحكم في ظهورها.</p></div></div><div class="panel empty">لا توجد ملاحظات مسجلة حالياً.</div>'}
async function fees(){const d=await api('/api/admin/fees').catch(()=>({fees:[]}));view.innerHTML=`<div class="head"><div><h2>الرسوم والمدفوعات</h2><p class="muted">الفواتير والمدفوعات والمتبقي.</p></div></div><div class="panel">${tbl(['الطالب','البيان','الإجمالي','المدفوع','المتبقي','الاستحقاق'],(d.fees||[]).map(f=>[esc(f.student_name),esc(f.description||'—'),money(f.amount),money(f.paid),money(Number(f.amount)-Number(f.paid)),esc(f.due_date||'—')]))}</div>`}
async function notifications(){view.innerHTML='<div class="head"><div><h2>الإشعارات</h2><p class="muted">رسائل وتنبيهات المدرسة.</p></div></div><div class="panel empty">مركز الإشعارات.</div>'}async function reports(){view.innerHTML='<div class="head"><div><h2>التقارير</h2><p class="muted">أكاديمية ومالية وإدارية.</p></div></div><div class="grid3"><div class="panel">📊 أكاديمي</div><div class="panel">💰 مالي</div><div class="panel">👥 إداري</div></div>'}
async function users(){const d=await api('/api/users');view.innerHTML=`<div class="head"><div><h2>المستخدمون</h2><p class="muted">الإدارة والمعلمون والموظفون وأولياء الأمور.</p></div></div><div class="panel">${tbl(['المستخدم','الاسم','الوظيفة','الحالة'],(d.users||[]).map(u=>[esc(u.username),esc(u.full_name),esc(u.role),u.active?'<span class="pill good">نشط</span>':'<span class="pill bad">موقوف</span>']))}</div>`}
async function roles(){const d=await api('/api/system/roles');view.innerHTML=`<div class="head"><div><h2>الوظائف والصلاحيات</h2><p class="muted">التحكم في صلاحيات الوظائف.</p></div></div><div class="panel">${tbl(['الوظيفة','المعرف','الحالة'],d.roles.map(r=>[esc(r.name),esc(r.slug),r.active?'<span class="pill good">نشطة</span>':'<span class="pill bad">معطلة</span>']))}</div>`}
async function settings(){const b=await api('/api/saas/branding');openModal('هوية المدرسة والإعدادات',`<div class="grid"><div class="field"><label>اسم المدرسة</label><input id="bn" value="${esc(b.school.name)}"></div><div class="field"><label>رابط الشعار</label><input id="bl" value="${esc(b.school.logo_url||'')}"></div><div class="field"><label>اللون الأساسي</label><input id="bp" type="color" value="${esc(b.school.primary_color||'#173b70')}"></div><div class="field"><label>اللون الثانوي</label><input id="bp2" type="color" value="${esc(b.school.secondary_color||'#24579b')}"></div></div><button onclick="saveBrand(${b.school.id})">حفظ الهوية</button>`)}async function saveBrand(id){await api('/api/saas/schools/'+id,{method:'PUT',body:JSON.stringify({name:bn.value,logo_url:bl.value,primary_color:bp.value,secondary_color:bp2.value})});closeModal();S.school=(await api('/api/saas/branding')).school;location.reload()}
async function schools(){if(!programmer())return;const d=await api('/api/saas/schools');view.innerHTML=`<div class="head"><div><h2>المدارس والاشتراكات</h2><p class="muted">مركز التحكم المركزي في المدارس والعملاء والخطط.</p></div><button onclick="schoolModal()">+ إضافة مدرسة</button></div><div class="cards"><div class="stat">🏢<small>المدارس</small><b>${d.schools.length}</b></div><div class="stat">👨‍🎓<small>الطلاب</small><b>${d.schools.reduce((a,x)=>a+Number(x.student_count||0),0)}</b></div><div class="stat">👥<small>المستخدمون</small><b>${d.schools.reduce((a,x)=>a+Number(x.user_count||0),0)}</b></div><div class="stat">💳<small>نشطة</small><b>${d.schools.filter(x=>x.subscription_status==='active').length}</b></div></div><div class="panel">${tbl(['المدرسة','الكود','الخطة','الاشتراك','الطلاب','المستخدمون'],d.schools.map(s=>[esc(s.name),esc(s.code),esc(s.plan),esc(s.subscription_status),s.student_count,s.user_count]))}</div>`}
function schoolModal(){openModal('إنشاء مدرسة جديدة',`<div class="grid"><div class="field"><label>اسم المدرسة</label><input id="cn"></div><div class="field"><label>كود المدرسة</label><input id="cc"></div><div class="field"><label>الخطة</label><select id="cp"><option>basic</option><option>professional</option><option>enterprise</option></select></div><div class="field"><label>حد الطلاب</label><input id="cm" type="number" value="500"></div><div class="field"><label>رابط الشعار</label><input id="cl"></div></div><button onclick="saveSchool()">إنشاء المدرسة</button>`)}async function saveSchool(){await api('/api/saas/schools',{method:'POST',body:JSON.stringify({name:cn.value,code:cc.value,plan:cp.value,max_students:Number(cm.value),logo_url:cl.value})});closeModal();schools()}
async function platform(){view.innerHTML='<div class="head"><div><h2>إدارة المنصة</h2><p class="muted">تحكم المبرمج في المنتج والخطط والاشتراكات وهوية العملاء.</p></div></div><div class="grid3"><div class="panel"><h3>🏢 مدارس متعددة</h3><p>حساب مستقل لكل مدرسة.</p></div><div class="panel"><h3>💳 اشتراكات</h3><p>خطط Basic وProfessional وEnterprise.</p></div><div class="panel"><h3>🎨 الهوية</h3><p>شعار واسم وألوان لكل مدرسة.</p></div></div>'}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('school_token');location.reload()}if(S.token)boot();
</script></body></html>
