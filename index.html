<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCore Platform</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif!important}.login{background:radial-gradient(circle at 15% 15%,#3d6aa8 0,#173b70 38%,#081a35 100%)!important}.loginbox{border:1px solid rgba(255,255,255,.18);box-shadow:0 35px 110px rgba(0,0,0,.42)!important}.hero{position:relative;overflow:hidden}.hero h1{font-size:38px}.hero .logo{background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.2)}.educore-footer{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:12px;color:#dbeafe;line-height:1.9}.educore-footer b{color:#fff}</style></head><body><div id="login" class="login"><div class="loginbox"><section class="hero"><div class="logo">🏫</div><h1>EduCore Platform</h1><p>منصة متخصصة بإدارة المدارس والمؤسسات التعليمية، تجمع الإدارة الأكاديمية والتشغيلية في منظومة واحدة آمنة وقابلة للتخصيص.</p><div class="educore-footer"><div>إنتاج وتطوير <b>مصطفى عادل الحاج زيدان</b></div><div>EduCore Platform · 2026</div></div></section><section class="loginform"><h2>تسجيل الدخول إلى EduCore Platform</h2><p class="muted">أدخل بيانات حسابك للوصول إلى بيئة مدرستك بأمان.</p><div id="loginMsg"></div><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="full" onclick="login()">دخول إلى المنصة</button></section></div></div><script>const S={token:localStorage.getItem('school_token'),user:null,school:null};async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'تعذر تنفيذ الطلب');return d}async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});S.token=d.token;localStorage.setItem('school_token',S.token);location.reload()}catch(e){loginMsg.innerHTML='<div style="padding:13px;border-radius:13px;background:#fff7e6;color:#77500a;margin:10px 0">'+String(e.message)+'</div>'}}</script><script src="/educore-brand.js"></script><script src="/enterprise-ui.js"></script></body></html>
