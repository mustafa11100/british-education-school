<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المدرسة</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#173b70;color:#fff}button.secondary{background:#e8eef7;color:#173b70}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 15px 50px #0001}.login-card h1{margin-top:0}.field{margin:10px 0}.field label{display:block;margin-bottom:6px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce3ee;border-radius:10px;background:#fff}.top{background:#173b70;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.layout{display:flex;min-height:calc(100vh - 62px)}aside{width:240px;background:#fff;border-left:1px solid #e5eaf1;padding:14px}aside button{width:100%;text-align:right;margin:4px 0;background:#fff;color:#26364f}aside button.active{background:#eaf0f8;color:#173b70;font-weight:700}.main{flex:1;padding:20px;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px}.card b{font-size:25px;display:block;margin-top:8px}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef3f8}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.msg{padding:10px;border-radius:10px;background:#fff2d8;margin:10px 0}.success{background:#e7f7ed}.danger{background:#ffe7e8}@media(max-width:800px){aside{width:76px;padding:8px}aside button span{display:none}.main{padding:12px}.top{padding:12px}}
</style></head>
<body>
<div id="login" class="login"><div class="login-card"><h1>🏫 إدارة المدرسة</h1><p>تسجيل الدخول إلى المنصة</p><div id="loginMsg"></div><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button style="width:100%" onclick="login()">دخول</button></div></div>
<div id="app" class="hidden"><header class="top"><div><b>🏫 إدارة المدرسة</b><div id="who"></div></div><button onclick="logout()">خروج</button></header><div class="layout"><aside id="nav"></aside><main class="main"><div id="view"></div></main></div></div>
<script>
const S={token:localStorage.getItem('school_token'),user:null};
const navItems=[['home','🏠','الرئيسية'],['students','👨‍🎓','الطلاب'],['parents','👨‍👩‍👧','أولياء الأمور'],['users','👥','المستخدمون'],['roles','🔐','الوظائف والصلاحيات'],['fees','💰','الرسوم والمدفوعات'],['results','📊','النتائج'],['attendance','📅','الحضور والغياب'],['notes','📝','ملاحظات الطلاب'],['reports','📈','التقارير']];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||'حدث خطأ');return d}
async function login(){const msg=document.getElementById('loginMsg');msg.innerHTML='';try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});S.token=d.token;S.user=d.user;localStorage.setItem('school_token',S.token);openApp()}catch(e){msg.innerHTML='<div class="msg danger">'+e.message+'</div>'}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('school_token');location.reload()}
async function openApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');who.textContent=(S.user.full_name||S.user.username)+' — '+S.user.role;buildNav();show('home')}
function buildNav(){nav.innerHTML=navItems.map(x=>`<button id="nav-${x[0]}" onclick="show('${x[0]}')"><span>${x[1]} </span>${x[2]}</button>`).join('')}
function active(id){navItems.forEach(x=>document.getElementById('nav-'+x[0])?.classList.remove('active'));document.getElementById('nav-'+id)?.classList.add('active')}
function money(n){return Number(n||0).toLocaleString('ar-EG')}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'">لا توجد بيانات</td></tr>'}</tbody></table></div>`}
async function show(id){active(id);const v=document.getElementById('view');v.innerHTML='<div class="panel">جاري التحميل...</div>';try{if(id==='home')return home();if(id==='students')return students();if(id==='parents')return parents();if(id==='users')return users();if(id==='roles')return roles();if(id==='fees')return fees();if(id==='results')return results();if(id==='attendance')return attendance();if(id==='notes')return notes();if(id==='reports')return reports()}catch(e){v.innerHTML='<div class="panel msg danger">'+e.message+'</div>'}}
async function home(){if(S.user.role==='ولي أمر')return parentHome();const [st,us,fs]=await Promise.all([api('/api/students'),api('/api/users').catch(()=>({users:[]})),api('/api/admin/fees').catch(()=>({fees:[]}))]);const total=fs.fees?.reduce((a,x)=>a+Number(x.amount||0),0)||0;const paid=fs.fees?.reduce((a,x)=>a+Number(x.paid||0),0)||0;v.innerHTML=`<h2>لوحة التحكم</h2><p>مرحباً ${S.user.full_name}</p><div class="cards"><div class="card">الطلاب<b>${st.students?.length||0}</b></div><div class="card">المستخدمون<b>${us.users?.length||0}</b></div><div class="card">إجمالي الرسوم<b>${money(total)}</b></div><div class="card">المتبقي<b>${money(total-paid)}</b></div></div><div class="panel"><h3>المنصة الآن</h3><p>تم تفعيل إدارة الطلاب، الوظائف والصلاحيات، الرسوم، النتائج، الحضور، الملاحظات وبوابة ولي الأمر.</p></div>`}
async function parentHome(){const d=await api('/api/parent/dashboard');const total=d.fees.reduce((a,x)=>a+Number(x.amount||0),0),paid=d.payments.reduce((a,x)=>a+Number(x.amount||0),0);v.innerHTML=`<h2>بوابة ولي الأمر</h2><div class="cards"><div class="card">أبنائي<b>${d.students.length}</b></div><div class="card">إجمالي الرسوم<b>${money(total)}</b></div><div class="card">المدفوع<b>${money(paid)}</b></div><div class="card">المتبقي<b>${money(total-paid)}</b></div></div><div class="panel"><h3>أبنائي</h3>${table(['الطالب','الصف','الفصل','الحالة'],d.students.map(s=>[s.full_name,s.grade||'-',s.class_name||'-',s.active?'نشط':'موقوف']))}</div><div class="grid2"><div class="panel"><h3>النتائج</h3>${table(['الطالب','المادة','الاختبار','الدرجة'],d.results.map(r=>[r.student_name||d.students.find(s=>s.id===r.student_id)?.full_name||'-',r.subject,r.exam||'-',`${r.score}/${r.max_score}`]))}</div><div class="panel"><h3>ملاحظات الإدارة والمعلمين</h3>${d.notes.length?d.notes.map(n=>`<div class="card"><b>${n.title||'ملاحظة'}</b><p>${n.content}</p><small>${n.created_at}</small></div>`).join(''):'لا توجد ملاحظات'}</div></div><div class="panel"><h3>الحضور والغياب</h3>${table(['الطالب','التاريخ','الحالة','ملاحظة'],d.attendance.map(a=>[d.students.find(s=>s.id===a.student_id)?.full_name||'-',a.attendance_date,a.status,a.notes||'-']))}</div><div class="panel"><h3>الرسوم والمدفوعات</h3>${table(['الطالب','البيان','المبلغ','الاستحقاق','المدفوع'],d.fees.map(f=>[d.students.find(s=>s.id===f.student_id)?.full_name||'-',f.description||'-',money(f.amount),f.due_date||'-',money(d.payments.filter(p=>p.fee_id===f.id).reduce((a,x)=>a+Number(x.amount),0))]))}</div>`}
async function students(){const d=await api('/api/students');v.innerHTML=`<h2>الطلاب</h2><div class="toolbar"><button onclick="addStudent()">+ إضافة طالب</button></div><div class="panel">${table(['الاسم','الرقم','الصف','الفصل','الحالة'],d.students.map(s=>[s.full_name,s.student_number||'-',s.grade||'-',s.class_name||'-',s.active?'نشط':'موقوف']))}</div>`}
async function addStudent(){const name=prompt('اسم الطالب');if(!name)return;const grade=prompt('الصف')||'',cls=prompt('الفصل')||'';await api('/api/students',{method:'POST',body:JSON.stringify({full_name:name,grade,class_name:cls})});students()}
async function parents(){const d=await api('/api/students');v.innerHTML=`<h2>أولياء الأمور وربط الأبناء</h2><div class="panel"><p>يتم ربط ولي الأمر بالطلاب من خلال علاقة <b>student_parents</b>، وبوابة ولي الأمر تعرض الأبناء المرتبطين به فقط.</p>${table(['الطالب','الصف','الفصل'],d.students.map(s=>[s.full_name,s.grade||'-',s.class_name||'-']))}</div>`}
async function users(){const d=await api('/api/users');v.innerHTML=`<h2>المستخدمون</h2><div class="toolbar"><button onclick="addUser()">+ إضافة مستخدم</button></div><div class="panel">${table(['المستخدم','الاسم','الوظيفة','الحالة'],d.users.map(u=>[u.username,u.full_name,u.role,u.active?'نشط':'موقوف']))}</div>`}
async function addUser(){const roles=await api('/api/system/roles');const name=prompt('الاسم الكامل');if(!name)return;const username=prompt('اسم المستخدم');if(!username)return;const password=prompt('كلمة المرور');if(!password)return;const role=prompt('اكتب الوظيفة كما تظهر في القائمة:\n'+roles.roles.map(r=>r.name).join('\n'));if(!role)return;await api('/api/users',{method:'POST',body:JSON.stringify({full_name:name,username,password,role})});users()}
async function roles(){const d=await api('/api/system/roles');v.innerHTML=`<h2>الوظائف والصلاحيات</h2><div class="toolbar"><button onclick="addRole()">+ وظيفة جديدة</button></div><div class="panel">${table(['الوظيفة','المعرف','الحالة','الصلاحيات'],d.roles.map(r=>[r.name,r.slug,r.active?'نشطة':'معطلة',`<button class="secondary" onclick="editRole(${r.id},'${r.name.replace(/'/g,"\\'")}')">إدارة</button>`]))}</div>`}
async function addRole(){const name=prompt('اسم الوظيفة');if(!name)return;const slug=prompt('معرف إنجليزي بدون مسافات');if(!slug)return;await api('/api/system/roles',{method:'POST',body:JSON.stringify({name,slug})});roles()}
async function editRole(id,name){const p=await api('/api/system/permissions');const current=await api('/api/system/roles/'+id+'/permissions');const selected=current.permissions.filter(x=>x.enabled).map(x=>x.id);const answer=prompt('اكتب أرقام الصلاحيات المطلوبة مفصولة بفاصلة:\n'+p.permissions.map(x=>x.id+' - '+x.label).join('\n'),selected.join(','));if(answer===null)return;const ids=answer.split(',').map(x=>Number(x.trim())).filter(Boolean);await api('/api/system/roles/'+id+'/permissions',{method:'PUT',body:JSON.stringify({permission_ids:ids})});alert('تم تحديث صلاحيات '+name);roles()}
async function fees(){const d=await api('/api/admin/fees');v.innerHTML=`<h2>الرسوم والمدفوعات</h2><div class="toolbar"><button onclick="addFee()">+ إضافة رسوم</button><button onclick="addPayment()">+ تسجيل دفعة</button></div><div class="panel">${table(['الطالب','البيان','الإجمالي','المدفوع','المتبقي','الاستحقاق'],d.fees.map(f=>[f.student_name,f.description||'-',money(f.amount),money(f.paid),money(Number(f.amount)-Number(f.paid)),f.due_date||'-']))}</div>`}
async function addFee(){const id=prompt('رقم الطالب');if(!id)return;const amount=prompt('المبلغ');if(!amount)return;const description=prompt('بيان الرسوم')||'';const due_date=prompt('تاريخ الاستحقاق YYYY-MM-DD')||'';await api('/api/admin/fees',{method:'POST',body:JSON.stringify({student_id:Number(id),amount:Number(amount),description,due_date})});fees()}
async function addPayment(){const student_id=prompt('رقم الطالب');if(!student_id)return;const amount=prompt('المبلغ المدفوع');if(!amount)return;const fee_id=prompt('رقم الرسوم (اختياري)')||null;await api('/api/admin/payments',{method:'POST',body:JSON.stringify({student_id:Number(student_id),amount:Number(amount),fee_id:fee_id?Number(fee_id):null})});fees()}
async function results(){const d=await api('/api/admin/results');v.innerHTML=`<h2>النتائج والدرجات</h2><div class="toolbar"><button onclick="addResult()">+ إدخال نتيجة</button></div><div class="panel">${table(['الطالب','المادة','الاختبار','الترم','الدرجة','ملاحظات'],d.results.map(r=>[r.student_name,r.subject,r.exam||'-',r.term||'-',r.score+'/'+r.max_score,r.notes||'-']))}</div>`}
async function addResult(){const student_id=prompt('رقم الطالب');if(!student_id)return;const subject=prompt('المادة');if(!subject)return;const score=prompt('الدرجة');const max_score=prompt('الدرجة القصوى')||100;const exam=prompt('الاختبار')||'';const term=prompt('الترم')||'';await api('/api/admin/results',{method:'POST',body:JSON.stringify({student_id:Number(student_id),subject,score:Number(score||0),max_score:Number(max_score),exam,term})});results()}
async function attendance(){const d=await api('/api/admin/attendance');v.innerHTML=`<h2>الحضور والغياب</h2><div class="toolbar"><button onclick="addAttendance()">+ تسجيل حضور/غياب</button></div><div class="panel">${table(['الطالب','التاريخ','الحالة','ملاحظة'],d.attendance.map(a=>[a.student_name,a.attendance_date,a.status,a.notes||'-']))}</div>`}
async function addAttendance(){const student_id=prompt('رقم الطالب');if(!student_id)return;const date=prompt('التاريخ YYYY-MM-DD');if(!date)return;const status=prompt('الحالة: حاضر / غائب / متأخر');if(!status)return;await api('/api/admin/attendance',{method:'POST',body:JSON.stringify({student_id:Number(student_id),attendance_date:date,status})});attendance()}
async function notes(){const d=await api('/api/students');v.innerHTML=`<h2>ملاحظات الطلاب</h2><div class="panel"><p>الملاحظات الحالية محفوظة في قاعدة البيانات ويمكن جعلها مرئية أو غير مرئية لولي الأمر. لإضافة ملاحظة من الواجهة سيتم ربطها بالطالب والمعلم في الإصدار التالي من نموذج الملاحظات.</p>${table(['الطالب','الصف','ملاحظات عامة'],d.students.map(s=>[s.full_name,s.grade||'-',s.notes||'-']))}</div>`}
async function reports(){const [s,f,r,a]=await Promise.all([api('/api/students'),api('/api/admin/fees'),api('/api/admin/results'),api('/api/admin/attendance')]);v.innerHTML=`<h2>التقارير</h2><div class="cards"><div class="card">الطلاب<b>${s.students.length}</b></div><div class="card">سجلات الرسوم<b>${f.fees.length}</b></div><div class="card">النتائج<b>${r.results.length}</b></div><div class="card">الحضور<b>${a.attendance.length}</b></div></div><div class="panel"><button onclick="window.print()">🖨️ طباعة التقرير</button></div>`}
(async()=>{if(!S.token)return;try{const d=await api('/api/auth/me');S.user=d.user;openApp()}catch{localStorage.removeItem('school_token')}})();
</script></body></html>
