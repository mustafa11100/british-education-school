<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCore Platform</title></head><body><div style="max-width:420px;margin:80px auto;font-family:Tahoma,Arial;padding:24px"><h1>EduCore Platform</h1><h2>تسجيل الدخول</h2><div id="msg"></div><p><input id="username" placeholder="اسم المستخدم" style="width:100%;padding:12px;box-sizing:border-box"></p><p><input id="password" type="password" placeholder="كلمة المرور" style="width:100%;padding:12px;box-sizing:border-box"></p><button onclick="login()" style="width:100%;padding:13px;background:#1761cf;color:white;border:0;border-radius:8px">دخول</button></div><script>async function login(){const msg=document.getElementById('msg');try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||'بيانات الدخول غير صحيحة');if(d.token)localStorage.setItem('school_token',d.token);if(d.user)localStorage.setItem('school_user',JSON.stringify(d.user));if(d.user&&(d.user.role==='owner'||d.user.role==='مالك المنصة'||d.user.is_owner))location.href='/owner-dashboard.html';else location.reload()}catch(e){msg.textContent=e.message;msg.style.color='#b91c1c'}}</script></body></html>
